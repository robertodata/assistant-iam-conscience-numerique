# Exemple pedagogique de configuration Nginx pour le projet IAM.
# Ce fichier n'est pas applique automatiquement.

server {
    # listen 80 signifie que Nginx ecoute le trafic HTTP standard.
    listen 80;

    # server_name indique le domaine vise.
    # "_" est une valeur generique utile pour un premier test.
    server_name _;

    # Les requetes vers /api/ sont envoyees au backend FastAPI.
    # FastAPI tourne ici en local sur le port 8000.
    location /api/ {
        # proxy_pass transmet la requete recue par Nginx vers FastAPI.
        # Exemple : /api/health sera transmis au backend.
        proxy_pass http://127.0.0.1:8000/;

        # Ces headers aident le backend a connaitre l'origine de la requete.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Toutes les autres requetes vont vers le frontend Next.js.
    # Next.js tourne ici en local sur le port 3000.
    location / {
        # Nginx joue le role de reverse proxy vers le frontend.
        proxy_pass http://127.0.0.1:3000;

        # Headers utiles pour conserver les informations de la requete initiale.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
